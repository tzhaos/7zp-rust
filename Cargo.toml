[workspace]
members = [
    "crates/p7z",
    "crates/zip-core",
    "crates/zip-engine",
    "crates/zip-requests",
    "crates/zip-platform",
    "crates/zip-ui",
    "crates/zip-commands",
    "crates/zip-explorer",
]
exclude = ["cardo"]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
cardo-runtime = { path = "cardo/crates/cardo-runtime" }
cardo-ui = { path = "cardo/crates/cardo-ui" }
tracing = "0.1"
zip-core = { path = "crates/zip-core" }
zip-engine = { path = "crates/zip-engine" }
zip-requests = { path = "crates/zip-requests" }
zip-platform = { path = "crates/zip-platform" }
zip-ui = { path = "crates/zip-ui" }
zip-commands = { path = "crates/zip-commands" }
anyhow = "1.0"
gpui-kit = "=0.6.1"
image = { version = "0.25", default-features = false }
rfd = "0.15"
tempfile = "3"
rust-embed = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
winreg = "0.55"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }
windows-sys = "0.59"
zip = { version = "2.4.2", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
