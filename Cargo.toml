[workspace]
members = [
    "crates/cardo-runtime",
    "crates/cardo-ui",
    "crates/cardo-7zp-app",
    "crates/cardo-7zp-core",
    "crates/cardo-7zp-engine",
    "crates/cardo-7zp-requests",
    "crates/cardo-7zp-platform",
    "crates/cardo-7zp-ui",
    "crates/cardo-7zp-commands",
    "crates/cardo-7zp-explorer",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
cardo-runtime = { path = "crates/cardo-runtime" }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
cardo-ui = { path = "crates/cardo-ui" }
cardo-7zp-core = { path = "crates/cardo-7zp-core" }
cardo-7zp-engine = { path = "crates/cardo-7zp-engine" }
cardo-7zp-requests = { path = "crates/cardo-7zp-requests" }
cardo-7zp-platform = { path = "crates/cardo-7zp-platform" }
cardo-7zp-ui = { path = "crates/cardo-7zp-ui" }
cardo-7zp-commands = { path = "crates/cardo-7zp-commands" }
anyhow = "1.0"
gpui-kit = "=0.6.1"
image = { version = "0.25", default-features = false }
rfd = "0.15"
tempfile = "3"
rust-embed = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
winreg = "0.55"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
windows-sys = "0.59"
zip = { version = "2.4.2", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
