[package]
name = "sevenzip-plus"
version = "0.1.0"
edition = "2024"
publish = false
description = "A native Windows archive manager built with GPUI Kit"

[[bin]]
name = "7zplus"
path = "src/main.rs"

[dependencies]
sevenzip-shell-api = { path = "crates/shell-api" }
anyhow = "1.0"
gpui-kit = "=0.6.1"
image = { version = "0.25", default-features = false }
rfd = "0.15"
tempfile = "3"
rust-embed = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
winreg = "0.55"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Time", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Mapi", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2.4.2", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"

[build-dependencies]
embed-resource = "=3.0.11"

[workspace]
members = ["crates/shell-api", "crates/shell"]
resolver = "3"
