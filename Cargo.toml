[package]
name = "sevenzip-plus"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "A native Windows archive manager built with GPUI Kit"

[[bin]]
name = "7zplus"
path = "src/main.rs"

[dependencies]
sevenzip-core.workspace = true
sevenzip-platform.workspace = true
sevenzip-ui.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
rfd.workspace = true

[profile.release]
lto = "thin"
strip = "debuginfo"

[build-dependencies]
embed-resource = "=3.0.11"

[workspace]
members = ["crates/core", "crates/archive", "crates/application", "crates/platform", "crates/ui", "crates/shell-api", "crates/shell"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sevenzip-core = { path = "crates/core" }
sevenzip-archive = { path = "crates/archive" }
sevenzip-application = { path = "crates/application" }
sevenzip-platform = { path = "crates/platform" }
sevenzip-ui = { path = "crates/ui" }
sevenzip-shell-api = { path = "crates/shell-api" }
anyhow = "1.0"
gpui-kit = "=0.6.1"
image = { version = "0.25", default-features = false }
rfd = "0.15"
tempfile = "3"
rust-embed = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
winreg = "0.55"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
windows-sys = "0.59"
zip = { version = "2.4.2", default-features = false }
