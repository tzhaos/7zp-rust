[workspace]
members = [
    "crates/cardo-7zp-app",
    "crates/cardo-7zp-core",
    "crates/cardo-7zp-archive",
    "crates/cardo-7zp-application",
    "crates/cardo-7zp-platform",
    "crates/cardo-7zp-ui",
    "crates/cardo-7zp-shell-api",
    "crates/cardo-7zp-shell",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
cardo-7zp-core = { path = "crates/cardo-7zp-core" }
cardo-7zp-archive = { path = "crates/cardo-7zp-archive" }
cardo-7zp-application = { path = "crates/cardo-7zp-application" }
cardo-7zp-platform = { path = "crates/cardo-7zp-platform" }
cardo-7zp-ui = { path = "crates/cardo-7zp-ui" }
cardo-7zp-shell-api = { path = "crates/cardo-7zp-shell-api" }
anyhow = "1.0"
gpui-kit = "=0.6.1"
image = { version = "0.25", default-features = false }
rfd = "0.15"
tempfile = "3"
rust-embed = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
winreg = "0.55"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
windows-sys = "0.59"
zip = { version = "2.4.2", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
