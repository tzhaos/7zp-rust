[workspace]
members = [
    "crates/p7z",
    "crates/p7z-core",
    "crates/p7z-engine",
    "crates/p7z-requests",
    "crates/p7z-platform",
    "crates/p7z-ui",
    "crates/p7z-commands",
    "crates/p7z-explorer",
]
exclude = ["cardo"]
resolver = "3"

[workspace.package]
version = "0.2.4"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
cardo-app = { path = "cardo/crates/cardo-app", features = ["config", "database", "localization", "diagnostics", "update"] }
cardo-update = { path = "cardo/crates/cardo-update" }
cardo-platform = { path = "cardo/crates/cardo-platform" }
cardo-runtime = { path = "cardo/crates/cardo-runtime", features = ["config", "database", "localization", "diagnostics"] }
cardo-ui = { path = "cardo/crates/cardo-ui", features = ["system-icons", "localization"] }
tracing = "0.1"
p7z-core = { path = "crates/p7z-core" }
p7z-engine = { path = "crates/p7z-engine" }
p7z-requests = { path = "crates/p7z-requests" }
p7z-platform = { path = "crates/p7z-platform" }
p7z-ui = { path = "crates/p7z-ui" }
p7z-commands = { path = "crates/p7z-commands" }
anyhow = "1.0"
gpui-kit = "=0.6.1"
image = { version = "0.25", default-features = false }
rfd = "0.15"
tempfile = "3"
rust-embed = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows-sys = "0.59"
zip = { version = "2.4.2", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
