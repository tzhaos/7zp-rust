[package]
name = "sevenzip-shell"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sevenzip-shell-api = { path = "../shell-api" }
serde_json = "1"
tempfile = "3"
winreg = "0.55"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_Shell"] }
